# Every function below validates the Firebase ID token itself
# (createRemoteJWKSet/jwtVerify against Firebase's own JWKS via _shared/),
# not a Supabase Auth JWT. Without verify_jwt = false, Supabase's
# platform-level JWT check rejects every request before the function's own
# code ever runs.

[functions.remark-validations]
verify_jwt = false

# Canonical slug (renamed from remark-validations). The old slug above stays
# deployed as a compat copy for old APKs/extension builds — see the NOTE in
# supabase/functions/validations/index.ts.
[functions.validations]
verify_jwt = false

[functions.user-sync]
verify_jwt = false

[functions.directory]
verify_jwt = false

[functions.claims]
verify_jwt = false

[functions.petty-cash]
verify_jwt = false

[functions.check-ins]
verify_jwt = false

[functions.r2-attachment-upload]
verify_jwt = false
